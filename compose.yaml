name: personal-ai-wealth-manager

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,10.0.2.2}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      BOOK_STORAGE_ROOT: /data/books
      BOOK_MAX_UPLOAD_BYTES: ${BOOK_MAX_UPLOAD_BYTES:-20971520}
      MARKETPLACE_IMPORT_MAX_BYTES: ${MARKETPLACE_IMPORT_MAX_BYTES:-10485760}
      MARKETPLACE_IMPORT_MAX_ROWS: ${MARKETPLACE_IMPORT_MAX_ROWS:-10000}
      MARKETPLACE_BATCH_RANK_MAX: ${MARKETPLACE_BATCH_RANK_MAX:-100}
      PSX_IMPORT_MAX_BYTES: ${PSX_IMPORT_MAX_BYTES:-5242880}
      PSX_IMPORT_MAX_ROWS: ${PSX_IMPORT_MAX_ROWS:-10000}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-disabled}
      ASSISTANT_MAX_CONVERSATIONS: ${ASSISTANT_MAX_CONVERSATIONS:-20}
      ASSISTANT_MAX_MESSAGES_PER_CONVERSATION: ${ASSISTANT_MAX_MESSAGES_PER_CONVERSATION:-50}
      ASSISTANT_RETRIEVAL_LIMIT: ${ASSISTANT_RETRIEVAL_LIMIT:-8}
      ASSISTANT_MAX_CONTEXT_CHARS: ${ASSISTANT_MAX_CONTEXT_CHARS:-12000}
      ASSISTANT_MAX_OUTPUT_CHARS: ${ASSISTANT_MAX_OUTPUT_CHARS:-12000}
      ASSISTANT_LOCAL_PROVIDER_URL: ${ASSISTANT_LOCAL_PROVIDER_URL:-http://host.docker.internal:11434/v1}
      ASSISTANT_LOCAL_PROVIDER_MODEL: ${ASSISTANT_LOCAL_PROVIDER_MODEL:-}
      ASSISTANT_PROVIDER_TIMEOUT_SECONDS: ${ASSISTANT_PROVIDER_TIMEOUT_SECONDS:-15}
      ASSISTANT_PROVIDER_MAX_CONCURRENCY: ${ASSISTANT_PROVIDER_MAX_CONCURRENCY:-2}
      ASSISTANT_PROVIDER_MAX_REQUEST_BYTES: ${ASSISTANT_PROVIDER_MAX_REQUEST_BYTES:-65536}
      ASSISTANT_PROVIDER_MAX_RESPONSE_BYTES: ${ASSISTANT_PROVIDER_MAX_RESPONSE_BYTES:-32768}
      ASSISTANT_PROVIDER_URL: ${ASSISTANT_PROVIDER_URL:-}
      ASSISTANT_PROVIDER_MODEL: ${ASSISTANT_PROVIDER_MODEL:-}
      ASSISTANT_PROVIDER_API_KEY: ${ASSISTANT_PROVIDER_API_KEY:-}
    volumes:
      - book_data:/data/books
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  notification-worker:
    build:
      context: ./backend
      target: runtime
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_ENV: ${APP_ENV:-development}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      NOTIFICATION_PROVIDER_TIMEOUT_SECONDS: ${NOTIFICATION_PROVIDER_TIMEOUT_SECONDS:-10}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "app.notification_worker", "loop"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  test-db:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wealth_manager_test
      POSTGRES_USER: wealth_test
      POSTGRES_PASSWORD: test_database_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wealth_test -d wealth_manager_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      POSTGRES_HOST: test-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: wealth_manager_test
      POSTGRES_USER: wealth_test
      POSTGRES_PASSWORD: test_database_password
      APP_ENV: test
      AUTH_SECRET: test_auth_secret_which_is_long_enough_1234567890abcdef
      ACCESS_TOKEN_MINUTES: "15"
      BOOK_STORAGE_ROOT: /data/books
      BOOK_MAX_UPLOAD_BYTES: "20971520"
    tmpfs:
      - /data/books
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "alembic downgrade base && alembic upgrade head && python -m pytest -q -p no:cacheprovider"]

volumes:
  postgres_data:
  book_data:
